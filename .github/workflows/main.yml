name: Build and Update Latest Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Sass
        run: npm install -g sass

      - name: Build CSS
        run: sass styles/one.scss dist/one.css --no-source-map

      - name: Create or Update "latest" Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: Automated build of one.css from main branch.
          files: dist/one.css
          make_latest: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
