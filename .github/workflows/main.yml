name: Build and Update Latest Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.ACTIONS_TOKEN }}
          persist-credentials: true

      - name: Install Bun
        run: curl -fsSL https://bun.sh/install | bash

      - name: Add Bun to PATH
        run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Install Sass
        run: npm install -g sass

      - name: Build CSS
        run: |
          # Build standard version
          sass styles/one.scss dist/one.css --no-source-map
          # Build minified version
          sass styles/one.scss dist/one.min.css --style=compressed --no-source-map
          # Build light version
          sass styles/one.light.scss dist/one.light.css --no-source-map
          # Build minified light version
          sass styles/one.light.scss dist/one.light.min.css --style=compressed --no-source-map

      - name: Commit and push dist updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: update dist assets [skip ci]" || echo "No dist changes to commit"
          git push origin main


      - name: Create or Update "latest" Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Build
          body: Automated build of one.css, one.min.css, one.light.css, and one.light.min.css from main branch.
          files: |
            dist/one.css
            dist/one.min.css
            dist/one.light.css
            dist/one.light.min.css
          make_latest: true
          prerelease: false
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
